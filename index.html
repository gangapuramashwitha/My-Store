<html>
<head>

<title>E-Commerce Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body { background: #f5f5f5; }

header {
    background: #222;
    color: white;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
    font-weight: bold;
}

.container {
    width: 90%;
    margin: 30px auto;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    text-align: center;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 15px;
    background: #28a745;
    color: white;
    text-decoration: none;
    border-radius: 4px;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 10px;
    margin-top: 40px;
}
</style>

</head>
<body>

<header>
    <h1>My E-Commerce Store</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="checkout.html">Checkout</a>
    </nav>
</header>

<div class="container">
    <h2>Products</h2>
    <div class="products">
        <div class="card">
            <img src="https://via.placeholder.com/300">
            <h3>Product One</h3>
            <p>$20</p>
            <a href="product.html" class="btn">View</a>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/300">
            <h3>Product Two</h3>
            <p>$35</p>
            <a href="product.html" class="btn">View</a>
        </div>
    </div>
</div>

<footer>© 2026 My Store</footer>

</body>
</html>
